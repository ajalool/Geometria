<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Cristal Dimensional Rojo Sangre - Universal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #0a0a0a; color: white; display: flex; flex-direction: column; align-items: center; }
        
        /* Controles superiores */
        .main-controls { 
            background: #222; padding: 10px; position: sticky; top: 0; z-index: 100; 
            display: flex; gap: 8px; width: 100%; justify-content: center; border-bottom: 1px solid #444;
            flex-wrap: wrap; box-shadow: 0 2px 15px rgba(0,0,0,0.9);
        }
        .main-controls span { font-size: 0.8em; align-self: center; color: #ccc; }
        .main-controls input { width: 45px; padding: 5px; border-radius: 4px; border: 1px solid #555; background: #111; color: white; text-align: center; font-size: 14px; }

        .math-panel { 
            background: #151515; padding: 15px 5px; border-bottom: 2px solid #ff4444; 
            width: 100%; display: flex; flex-direction: column; align-items: center; 
        }
        
        /* Contenedor de la secuencia - Ajustado para móvil */
        .inputs-row { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); /* 2 columnas en móvil */
            gap: 10px; 
            width: 95%;
            max-width: 500px;
        }

        /* En PC volvemos a 4 columnas */
        @media (min-width: 600px) {
            .inputs-row { grid-template-columns: repeat(4, 1fr); }
        }
        
        .box-container { 
            display: flex; flex-direction: column; align-items: center; gap: 4px; 
            background: #2a2a2a; padding: 8px; border-radius: 8px; border: 2px solid #444; 
        }
        .box-container.active { border-color: #ffeb3b; background: #3d3500; box-shadow: 0 0 12px #ffeb3b; }
        
        .val-btn { width: 100%; height: 35px; background: #eee; color: #000; display: flex; align-items: center; justify-content: center; font-weight: bold; border-radius: 4px; font-size: 16px; }
        .action-row { display: flex; gap: 5px; width: 100%; margin-top: 4px; }
        .mini-btn { 
            flex: 1; height: 32px; display: flex; align-items: center; justify-content: center; 
            font-size: 18px; background: #444; border-radius: 4px; cursor: pointer; border: 1px solid #666; 
        }

        .equation-display { font-family: 'Courier New', monospace; color: #ff4444; font-weight: bold; font-size: 1.2em; margin-top: 15px; text-align: center; }
        #canvas-container { width: 100%; display: flex; justify-content: center; }
        .hint { font-size: 0.75em; color: #888; text-align: center; margin-top: 8px; padding: 0 10px; }
    </style>
</head>
<body>

    <div class="main-controls" id="ui-main"></div>

    <div class="math-panel">
        <div class="inputs-row">
            <div class="box-container" id="cont-v1">
                <div class="val-btn" id="num-v1">4</div>
                <div class="action-row">
                    <div class="mini-btn" title="Elegir en cristal" onclick="setMode('v1', 'touch')">☝️</div>
                    <div class="mini-btn" title="Escribir número" onclick="setMode('v1', 'kb')">⌨️</div>
                </div>
            </div>
            <div class="box-container" id="cont-v2">
                <div class="val-btn" id="num-v2">10</div>
                <div class="action-row">
                    <div class="mini-btn" onclick="setMode('v2', 'touch')">☝️</div>
                    <div class="mini-btn" onclick="setMode('v2', 'kb')">⌨️</div>
                </div>
            </div>
            <div class="box-container" id="cont-v3">
                <div class="val-btn" id="num-v3">28</div>
                <div class="action-row">
                    <div class="mini-btn" onclick="setMode('v3', 'touch')">☝️</div>
                    <div class="mini-btn" onclick="setMode('v3', 'kb')">⌨️</div>
                </div>
            </div>
            <div class="box-container" id="cont-v4">
                <div class="val-btn" id="num-v4">82</div>
                <div class="action-row">
                    <div class="mini-btn" onclick="setMode('v4', 'touch')">☝️</div>
                    <div class="mini-btn" onclick="setMode('v4', 'kb')">⌨️</div>
                </div>
            </div>
        </div>
        <p class="hint">Usa ☝️ para capturar una fila tocando el cristal.<br>Usa ⌨️ para entrada manual.</p>
        <div class="equation-display" id="equation-text">Ecuación: aₙ = 3ⁿ + 1</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let hexSize = 15;
        let colorMap = { 1: '#FFB6C1', 2: '#9370DB', 3: '#FF4500', 4: '#FFA500', 5: '#32CD32', 6: '#1E90FF', 7: '#ADFF2F', 8: '#DDA0DD', 9: '#FFFF00', 10: '#00FFFF', 11: '#FF69B4', 12: '#8B4513', 13: '#7FFFD4', 14: '#FFD700', 15: '#4B0082', 16: '#00FF7F', 17: '#F08080', 18: '#4682B4', 19: '#E6E6FA', 20: '#808000', 21: '#000080' };

        let startInp, maxInp, rowsInp;
        let activeId = null;

        function setMode(id, type) {
            document.querySelectorAll('.box-container').forEach(c => c.classList.remove('active'));
            activeId = null;
            if (type === 'touch') {
                document.getElementById('cont-' + id).classList.add('active');
                activeId = id;
            } else {
                let currentVal = document.getElementById('num-' + id).innerText;
                let newVal = prompt("Ingresa el número de fila:", currentVal);
                if (newVal !== null && newVal !== "") {
                    document.getElementById('num-' + id).innerText = newVal;
                    updateAll();
                }
            }
        }

        function setup() {
            pixelDensity(2);
            let ui = select('#ui-main');
            createSpan("Inic:").parent(ui);
            startInp = createInput('1').parent(ui).input(updateAll);
            createSpan("Max:").parent(ui);
            maxInp = createInput('21').parent(ui).input(updateData); // Referencia a updateData corregida abajo
            createSpan("Filas:").parent(ui);
            rowsInp = createInput('40').parent(ui).input(updateAll);

            let canvas = createCanvas(windowWidth, 1000);
            canvas.parent('canvas-container');
            noLoop();
            updateAll();
        }

        function mousePressed() {
            if (activeId && mouseY > 0) {
                let h = hexSize * 1.5;
                let fila = Math.round((mouseY - 100) / h) + 1;
                if (fila >= 1) {
                    document.getElementById('num-' + activeId).innerText = fila;
                    document.getElementById('cont-' + activeId).classList.remove('active');
                    activeId = null;
                    updateAll();
                    if(navigator.vibrate) navigator.vibrate(40);
                }
            }
        }

        function updateAll() {
            let r_count = parseInt(rowsInp.value()) || 1;
            // Ajuste de tamaño dinámico
            hexSize = r_count > 60 ? (r_count > 150 ? 5 : 8) : 15;
            
            let totalH = (r_count * 2 * hexSize * 1.5) + 400;
            resizeCanvas(windowWidth, totalH);
            
            // Analizar ecuación
            let v = ['v1','v2','v3','v4'].map(id => 
                parseFloat(document.getElementById('num-'+id).innerText)
            ).filter(n => !isNaN(n));
            
            let res = document.getElementById('equation-text');
            if (v.length >= 2) {
                let d1 = v[1]-v[0], d2 = v.length>2?v[2]-v[1]:d1, ratio = d1!==0?d2/d1:0;
                if (ratio > 0 && ratio !== 1 && v.length >= 3) {
                    res.innerText = `Ecuación: aₙ = ${ratio.toFixed(0)}ⁿ + ${(v[0]-(d1/(ratio-1))).toFixed(0)}`;
                } else {
                    res.innerText = `Ecuación: aₙ = ${d1}n + ${v[0]-d1}`;
                }
            }
            redraw();
        }

        function updateData() { updateAll(); } // Alias para compatibilidad

        function draw() {
            background(10);
            let r_count = parseInt(rowsInp.value()) || 40;
            let m_val = parseInt(maxInp.value()) || 21;
            let h = hexSize * 1.5;
            let w = Math.sqrt(3) * hexSize;

            // Dibujar líneas amarillas (Capas de selección)
            ['v1','v2','v3','v4'].forEach(id => {
                let f = parseInt(document.getElementById('num-' + id).innerText);
                if(!isNaN(f)) {
                    stroke(255, 235, 59, 150); strokeWeight(4);
                    line(0, 100 + (f-1)*h, width, 100 + (f-1)*h);
                }
            });

            // Generar y dibujar cristal
            let grid = [];
            for (let r = 0; r < r_count; r++) {
                let row = [];
                for (let c = 0; c <= r; c++) {
                    let val = (r === 0 || c === 0 || c === r) ? 1 : wrappedSum(grid[r-1][c-1] + grid[r-1][c], m_val);
                    row.push(val);
                    drawHex(width/2 + (c - r/2) * w, 100 + r * h, val, hexSize);
                }
                grid.push(row);
            }
            let lastR = grid[r_count-1];
            for (let r = 1; r < r_count; r++) {
                let nextR = [];
                for (let c = 0; c < lastR.length - 1; c++) {
                    let val = wrappedSum(lastR[c] + lastR[c+1], m_val);
                    nextR.push(val);
                    drawHex(width/2 + (c - (lastR.length-2)/2) * w, 100 + (r_count - 1 + r) * h, val, hexSize);
                }
                lastR = nextR;
            }

            // Guías rojas
            for (let i = 1; i <= r_count * 2; i++) {
                if (i === 1 || i % 10 === 0) {
                    let ly = 100 + (i-1)*h;
                    stroke(255, 0, 0, 120); strokeWeight(1.5);
                    line(50, ly, width-50, ly);
                    noStroke(); fill(255, 100, 100); textSize(12); text("Fila "+i, 10, ly+4);
                }
            }
        }

        function drawHex(x, y, v, s) {
            let margin = 1000;
            if (y < scrollY - margin || y > scrollY + windowHeight + margin) return;
            push(); translate(x, y); fill(colorMap[v] || '#444'); stroke(0, 40);
            beginShape();
            for (let i = 0; i < 6; i++) { let a = TWO_PI/6 * i - PI/2; vertex(cos(a)*s, sin(a)*s); }
            endShape(CLOSE);
            if (s > 7) { fill(v > 15 || [2,3,21].includes(v) ? 255 : 0); textAlign(CENTER, CENTER); textSize(s*0.6); text(v, 0, 0); }
            pop();
        }

        function wrappedSum(n, m) { let r = n; while (r > m) r -= m; return r; }
    </script>
</body>
</html>
