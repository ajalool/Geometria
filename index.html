<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cristal Dimensional - Selección de Precisión</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #0a0a0a; color: white; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; touch-action: pan-y; }
        .main-controls { background: #222; padding: 12px; border-radius: 8px; position: sticky; top: 10px; z-index: 100; display: flex; gap: 15px; margin: 10px; border: 1px solid #444; }
        .math-panel { background: #151515; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ff4444; width: 90%; display: flex; flex-direction: column; align-items: center; box-shadow: 0 0 20px rgba(255, 68, 68, 0.2); }
        .inputs-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        input.prog-input { width: 70px; padding: 8px; border-radius: 4px; border: 2px solid transparent; text-align: center; font-weight: bold; background: #eee; color: #000; }
        input.prog-input:focus { outline: none; border-color: #ffeb3b; background: #fffde7; }
        .equation-display { font-family: 'Courier New', monospace; color: #ff4444; font-weight: bold; font-size: 1.2em; }
        #canvas-container { width: 100%; display: flex; justify-content: center; }
        .hint { font-size: 0.8em; color: #888; margin-top: -5px; text-align: center; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="main-controls" id="ui-main"></div>

    <div class="math-panel">
        <div class="inputs-row">
            <span>Secuencia:</span>
            <input type="number" id="v1" class="prog-input" value="4">
            <input type="number" id="v2" class="prog-input" value="10">
            <input type="number" id="v3" class="prog-input" value="28">
            <input type="number" id="v4" class="prog-input" value="82">
        </div>
        <p class="hint">PC: Clic normal | Celular: Mantén presionado <b>2 seg sin mover</b> para seleccionar fila</p>
        <div class="equation-display" id="equation-text">Analizando...</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let hexSize = 15;
        let colorMap = {
            1: '#FFB6C1', 2: '#9370DB', 3: '#FF4500', 4: '#FFA500', 5: '#32CD32',
            6: '#1E90FF', 7: '#ADFF2F', 8: '#DDA0DD', 9: '#FFFF00', 10: '#00FFFF',
            11: '#FF69B4', 12: '#8B4513', 13: '#7FFFD4', 14: '#FFD700', 15: '#4B0082',
            16: '#00FF7F', 17: '#F08080', 18: '#4682B4', 19: '#E6E6FA', 20: '#808000', 21: '#000080'
        };

        let initialValueInput, maxValueInput, rowsInput;
        let lastFocusedInput = null;
        
        // Variables para control de presión
        let touchTimer;
        let touchStartX, touchStartY;
        let isLongPress = false;
        let isMobile = false;

        function setup() {
            isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            let ui = select('#ui-main');
            createSpan("Inicio:").parent(ui);
            initialValueInput = createInput('1').parent(ui);
            createSpan("Máx:").parent(ui);
            maxValueInput = createInput('21').parent(ui);
            createSpan("Filas:").parent(ui);
            rowsInput = createInput('40').parent(ui);

            initialValueInput.input(updateAll);
            maxValueInput.input(updateAll);
            rowsInput.input(updateAll);

            ['v1', 'v2', 'v3', 'v4'].forEach(id => {
                let el = document.getElementById(id);
                el.addEventListener('focus', (e) => lastFocusedInput = e.target);
                el.addEventListener('input', updateAll);
            });

            let canvas = createCanvas(windowWidth - 50, 2000);
            canvas.parent('canvas-container');
            
            noLoop();
            updateAll();
        }

        // LÓGICA DE DETECCIÓN: Diferencia Clic/Scroll
        function mousePressed() {
            if (!lastFocusedInput) return;
            
            touchStartX = mouseX;
            touchStartY = mouseY;
            isLongPress = false;

            if (isMobile) {
                // Iniciar contador de 2 segundos para celular
                touchTimer = setTimeout(() => {
                    isLongPress = true;
                    executeSelection();
                }, 2000); 
            } else {
                // PC: selección instantánea
                executeSelection();
            }
        }

        function mouseDragged() {
            // Si el dedo se mueve más de 10px, asumimos que es SCROLL
            let distance = dist(touchStartX, touchStartY, mouseX, mouseY);
            if (distance > 10) {
                clearTimeout(touchTimer); // Cancela la selección
            }
        }

        function mouseReleased() {
            clearTimeout(touchTimer);
        }

        function executeSelection() {
            let h = hexSize * 1.5;
            let filaDetectada = Math.round((mouseY - 100) / h) + 1;
            if (filaDetectada >= 1 && lastFocusedInput) {
                lastFocusedInput.value = filaDetectada;
                if(isMobile && window.navigator.vibrate) window.navigator.vibrate(70); // Vibración de éxito
                updateAll();
            }
        }

        function updateAll() {
            let rows = parseInt(rowsInput.value()) || 1;
            hexSize = rows > 60 ? (rows > 150 ? 5 : 8) : 15;
            let h = hexSize * 1.5;
            let totalHeight = (rows * 2 * h) + 400;
            resizeCanvas(width, totalHeight);
            analizarProgresion();
            redraw();
        }

        function analizarProgresion() {
            let v = [
                parseFloat(document.getElementById('v1').value),
                parseFloat(document.getElementById('v2').value),
                parseFloat(document.getElementById('v3').value),
                parseFloat(document.getElementById('v4').value)
            ].filter(n => !isNaN(n));

            let res = document.getElementById('equation-text');
            if (v.length < 2) return;
            let d1 = v[1] - v[0];
            let d2 = v.length > 2 ? v[2] - v[1] : d1;
            let r = d1 !== 0 ? d2 / d1 : 0;

            if (r > 0 && r !== 1 && v.length >= 3) {
                let a = d1 / (r - 1);
                let c = v[0] - a;
                res.innerText = `Ecuación: aₙ = ${r.toFixed(0)}ⁿ + ${c.toFixed(0)}`;
            } else {
                let d = v[1] - v[0];
                let c = v[0] - d;
                res.innerText = `Ecuación Lineal: aₙ = ${d}n ${c >= 0 ? '+ ':'- '}${Math.abs(c)}`;
            }
        }

        function draw() {
            background(10);
            let rows = parseInt(rowsInput.value()) || 40;
            let maxVal = parseInt(maxValueInput.value()) || 21;
            let h = hexSize * 1.5;
            let w = Math.sqrt(3) * hexSize;

            // Dibujar líneas amarillas de selección
            let v_actuales = [
                parseInt(document.getElementById('v1').value),
                parseInt(document.getElementById('v2').value),
                parseInt(document.getElementById('v3').value),
                parseInt(document.getElementById('v4').value)
            ];
            v_actuales.forEach(f => {
                if (!isNaN(f)) {
                    let ly = 100 + (f - 1) * h;
                    stroke(255, 235, 59, 150); strokeWeight(3);
                    line(0, ly, width, ly);
                }
            });

            // Generar y dibujar cristal
            let allRows = [];
            for (let r = 0; r < rows; r++) {
                let rowVals = [];
                for (let c = 0; c <= r; c++) {
                    let val = (r === 0 || c === 0 || c === r) ? 1 : wrappedSum(allRows[r-1][c-1] + allRows[r-1][c], maxVal);
                    rowVals.push(val);
                    drawHex(width/2 + (c - r/2) * w, 100 + r * h, val, hexSize);
                }
                allRows.push(rowVals);
            }
            let lastRow = allRows[rows-1];
            for (let r = 1; r < rows; r++) {
                let nextRow = [];
                for (let c = 0; c < lastRow.length - 1; c++) {
                    let val = wrappedSum(lastRow[c] + lastRow[c+1], maxVal);
                    nextRow.push(val);
                    drawHex(width/2 + (c - (lastRow.length-2)/2) * w, 100 + (rows - 1 + r) * h, val, hexSize);
                }
                lastRow = nextRow;
            }

            // Guías Rojas
            for (let i = 1; i <= rows * 2; i++) {
                if (i === 1 || i % 10 === 0) {
                    let ly = 100 + (i-1)*h;
                    stroke(255, 0, 0, 100); strokeWeight(1.5);
                    line(80, ly, width-80, ly);
                    noStroke(); fill(255, 100, 100); textSize(12); text("Fila "+i, 30, ly+4);
                }
            }
        }

        function drawHex(x, y, v, s) {
            let margin = 1000;
            if (y < scrollY - margin || y > scrollY + windowHeight + margin) return;
            push(); translate(x, y); fill(colorMap[v] || '#444'); stroke(0, 40);
            beginShape();
            for (let i = 0; i < 6; i++) { let a = TWO_PI/6 * i - PI/2; vertex(cos(a) * s, sin(a) * s); }
            endShape(CLOSE);
            if (s > 10) {
                fill(v > 15 || [2,3,21].includes(v) ? 255 : 0);
                textAlign(CENTER, CENTER); textSize(s * 0.65); text(v, 0, 0);
            }
            pop();
        }

        function wrappedSum(n, m) {
            let r = n;
            while (r > m) r -= m;
            return r;
        }
    </script>
</body>
</html>
