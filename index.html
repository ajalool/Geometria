<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cristal Dimensional - Conexión Total</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #0a0a0a; color: white; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        .main-controls { background: #222; padding: 12px; border-radius: 8px; position: sticky; top: 10px; z-index: 100; display: flex; gap: 15px; margin: 10px; border: 1px solid #444; }
        .math-panel { background: #151515; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ff4444; width: 90%; display: flex; flex-direction: column; align-items: center; box-shadow: 0 0 20px rgba(255, 68, 68, 0.2); }
        .inputs-row { display: flex; gap: 8px; align-items: center; justify-content: center; }
        
        /* Contenedor del input */
        .input-box { width: 60px; height: 40px; background: #eee; color: #000; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; border: 2px solid transparent; }
        .input-box.active { border-color: #ffeb3b; background: #fffde7; box-shadow: 0 0 15px #ffeb3b; }
        
        .equation-display { font-family: 'Courier New', monospace; color: #ff4444; font-weight: bold; font-size: 1.2em; margin-top: 10px; }
        #canvas-container { width: 100%; display: flex; justify-content: center; touch-action: none; } /* touch-action none es clave */
        .hint { font-size: 0.75em; color: #888; text-align: center; margin-top: 5px; }
    </style>
</head>
<body oncontextmenu="return false;"> <div class="main-controls" id="ui-main"></div>

    <div class="math-panel">
        <div class="inputs-row">
            <div id="box-v1" class="input-box" onclick="selectBox('v1')">4</div>
            <div id="box-v2" class="input-box" onclick="selectBox('v2')">10</div>
            <div id="box-v3" class="input-box" onclick="selectBox('v3')">28</div>
            <div id="box-v4" class="input-box" onclick="selectBox('v4')">82</div>
        </div>
        <p class="hint">1. Toca un cuadro arriba (se pondrá amarillo) | 2. Deja el dedo 1s en una fila.</p>
        <div class="equation-display" id="equation-text">Analizando...</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let hexSize = 15;
        let colorMap = { 1: '#FFB6C1', 2: '#9370DB', 3: '#FF4500', 4: '#FFA500', 5: '#32CD32', 6: '#1E90FF', 7: '#ADFF2F', 8: '#DDA0DD', 9: '#FFFF00', 10: '#00FFFF', 11: '#FF69B4', 12: '#8B4513', 13: '#7FFFD4', 14: '#FFD700', 15: '#4B0082', 16: '#00FF7F', 17: '#F08080', 18: '#4682B4', 19: '#E6E6FA', 20: '#808000', 21: '#000080' };

        let initialValueInput, maxValueInput, rowsInput;
        let activeTarget = null;
        let pressTimer;
        let startX, startY;

        function selectBox(id) {
            document.querySelectorAll('.input-box').forEach(b => b.classList.remove('active'));
            document.getElementById('box-' + id).classList.add('active');
            activeTarget = id;
        }

        function setup() {
            pixelDensity(2);
            let ui = select('#ui-main');
            createSpan("Inicio:").parent(ui);
            initialValueInput = createInput('1').parent(ui);
            createSpan("Máx:").parent(ui);
            maxValueInput = createInput('21').parent(ui);
            createSpan("Filas:").parent(ui);
            rowsInput = createInput('40').parent(ui);

            initialValueInput.input(() => updateAll());
            maxValueInput.input(() => updateAll());
            rowsInput.input(() => updateAll());

            let canvas = createCanvas(windowWidth - 40, 1000);
            canvas.parent('canvas-container');

            // EVENTOS NATIVOS (Ignoran las limitaciones de p5.js)
            let el = canvas.elt;
            el.addEventListener('touchstart', startPress, {passive: false});
            el.addEventListener('touchmove', movePress, {passive: false});
            el.addEventListener('touchend', endPress);
            el.addEventListener('mousedown', (e) => { if(activeTarget) executeSelection(e.offsetY); });

            updateAll();
        }

        function startPress(e) {
            if (!activeTarget) return;
            let t = e.touches[0];
            startX = t.clientX; startY = t.clientY;
            
            // Si el dedo se queda quieto 1 segundo
            pressTimer = setTimeout(() => {
                let rect = canvas.elt.getBoundingClientRect();
                let yOnCanvas = t.clientY - rect.top;
                executeSelection(yOnCanvas);
                if(navigator.vibrate) navigator.vibrate(50);
            }, 1000);
        }

        function movePress(e) {
            let t = e.touches[0];
            if (dist(startX, startY, t.clientX, t.clientY) > 10) {
                clearTimeout(pressTimer); // Es un scroll, cancelar seleccion
            }
        }

        function endPress() {
            clearTimeout(pressTimer);
        }

        function executeSelection(y) {
            let h = hexSize * 1.5;
            let fila = Math.round((y - 100) / h) + 1;
            if (fila >= 1 && activeTarget) {
                document.getElementById('box-' + activeTarget).innerText = fila;
                updateAll();
            }
        }

        function updateAll() {
            let rows = parseInt(rowsInput.value()) || 1;
            hexSize = rows > 60 ? (rows > 150 ? 5 : 8) : 15;
            resizeCanvas(width, (rows * 2 * hexSize * 1.5) + 400);
            analizarProgresion();
            redraw();
        }

        function analizarProgresion() {
            let v = [
                parseFloat(document.getElementById('box-v1').innerText),
                parseFloat(document.getElementById('box-v2').innerText),
                parseFloat(document.getElementById('box-v3').innerText),
                parseFloat(document.getElementById('box-v4').innerText)
            ].filter(n => !isNaN(n));

            let res = document.getElementById('equation-text');
            if (v.length < 2) return;
            let d1 = v[1] - v[0];
            let d2 = v.length > 2 ? v[2] - v[1] : d1;
            let r = d1 !== 0 ? d2 / d1 : 0;

            if (r > 0 && r !== 1 && v.length >= 3) {
                let a = d1 / (r - 1);
                let c = v[0] - a;
                res.innerText = `Ecuación: aₙ = ${r.toFixed(0)}ⁿ + ${c.toFixed(0)}`;
            } else {
                let d = v[1] - v[0];
                res.innerText = `Ecuación Lineal: aₙ = ${d}n + ${v[0]-d}`;
            }
        }

        function draw() {
            background(10);
            let rows = parseInt(rowsInput.value()) || 40;
            let maxVal = parseInt(maxValueInput.value()) || 21;
            let h = hexSize * 1.5;
            let w = Math.sqrt(3) * hexSize;

            // Iluminar Filas Seleccionadas
            ['v1','v2','v3','v4'].forEach(id => {
                let f = parseInt(document.getElementById('box-' + id).innerText);
                if(!isNaN(f)) {
                    stroke(255, 235, 59, 150); strokeWeight(4);
                    line(0, 100 + (f-1)*h, width, 100 + (f-1)*h);
                }
            });

            // Dibujar Cristal
            let allRows = [];
            for (let r = 0; r < rows; r++) {
                let rowVals = [];
                for (let c = 0; c <= r; c++) {
                    let val = (r === 0 || c === 0 || c === r) ? 1 : wrappedSum(allRows[r-1][c-1] + allRows[r-1][c], maxVal);
                    rowVals.push(val);
                    drawHex(width/2 + (c - r/2) * w, 100 + r * h, val, hexSize);
                }
                allRows.push(rowVals);
            }
            let lastR = allRows[rows-1];
            for (let r = 1; r < rows; r++) {
                let nextR = [];
                for (let c = 0; c < lastR.length - 1; c++) {
                    let val = wrappedSum(lastR[c] + lastR[c+1], maxVal);
                    nextR.push(val);
                    drawHex(width/2 + (c - (lastR.length-2)/2) * w, 100 + (rows - 1 + r) * h, val, hexSize);
                }
                lastR = nextR;
            }
        }

        function drawHex(x, y, v, s) {
            if (y < scrollY - 500 || y > scrollY + windowHeight + 500) return;
            push(); translate(x, y); fill(colorMap[v] || '#444'); stroke(0, 30);
            beginShape();
            for (let i = 0; i < 6; i++) { let a = TWO_PI/6 * i - PI/2; vertex(cos(a)*s, sin(a)*s); }
            endShape(CLOSE);
            if (s > 7) { fill(v > 15 || [2,3,21].includes(v) ? 255 : 0); textAlign(CENTER, CENTER); textSize(s*0.65); text(v, 0, 0); }
            pop();
        }

        function wrappedSum(n, m) { let r = n; while (r > m) r -= m; return r; }
    </script>
</body>
</html>
