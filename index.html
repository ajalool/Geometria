<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cristal Dimensional - Fix Final</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #0a0a0a; color: white; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        .main-controls { background: #222; padding: 12px; border-radius: 8px; position: sticky; top: 10px; z-index: 100; display: flex; gap: 8px; margin: 10px; border: 1px solid #444; flex-wrap: wrap; justify-content: center; }
        .math-panel { background: #151515; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ff4444; width: 92%; display: flex; flex-direction: column; align-items: center; box-shadow: 0 0 20px rgba(255, 68, 68, 0.2); }
        .inputs-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
        
        .input-wrapper { display: flex; align-items: center; background: #eee; border-radius: 4px; border: 2px solid transparent; overflow: hidden; }
        .input-wrapper.active { border-color: #ffeb3b; box-shadow: 0 0 12px #ffeb3b; background: #fffde7; }
        
        .num-display { width: 45px; height: 35px; color: #000; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; border-right: 1px solid #bbb; }
        .kb-trigger { padding: 0 10px; cursor: pointer; font-size: 16px; display: flex; align-items: center; height: 35px; background: #ddd; color: #000; }
        
        .hidden-input { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
        .equation-display { font-family: 'Courier New', monospace; color: #ff4444; font-weight: bold; font-size: 1.1em; margin-top: 10px; text-align: center; }
        #canvas-container { width: 100%; display: flex; justify-content: center; }
        .hint { font-size: 0.75em; color: #888; text-align: center; margin-top: 5px; line-height: 1.3; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="main-controls" id="ui-main"></div>

    <div class="math-panel">
        <div class="inputs-row">
            <div class="input-wrapper" id="wrap-v1"><div class="num-display" onclick="activateCapture('v1')">4</div><div class="kb-trigger" onclick="openKeyboard('v1')">⌨️</div></div>
            <div class="input-wrapper" id="wrap-v2"><div class="num-display" onclick="activateCapture('v2')">10</div><div class="kb-trigger" onclick="openKeyboard('v2')">⌨️</div></div>
            <div class="input-wrapper" id="wrap-v3"><div class="num-display" onclick="activateCapture('v3')">28</div><div class="kb-trigger" onclick="openKeyboard('v3')">⌨️</div></div>
            <div class="input-wrapper" id="wrap-v4"><div class="num-display" onclick="activateCapture('v4')">82</div><div class="kb-trigger" onclick="openKeyboard('v4')">⌨️</div></div>
        </div>
        <input type="number" id="real-v1" class="hidden-input" oninput="syncManual('v1')">
        <input type="number" id="real-v2" class="hidden-input" oninput="syncManual('v2')">
        <input type="number" id="real-v3" class="hidden-input" oninput="syncManual('v3')">
        <input type="number" id="real-v4" class="hidden-input" oninput="syncManual('v4')">

        <p class="hint">1. Toca un número arriba | 2. Mantén 1 seg una fila para seleccionar.<br>Zoom y Scroll habilitados.</p>
        <div class="equation-display" id="equation-text">Analizando cristal...</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let hexSize = 15;
        let colorMap = { 1: '#FFB6C1', 2: '#9370DB', 3: '#FF4500', 4: '#FFA500', 5: '#32CD32', 6: '#1E90FF', 7: '#ADFF2F', 8: '#DDA0DD', 9: '#FFFF00', 10: '#00FFFF', 11: '#FF69B4', 12: '#8B4513', 13: '#7FFFD4', 14: '#FFD700', 15: '#4B0082', 16: '#00FF7F', 17: '#F08080', 18: '#4682B4', 19: '#E6E6FA', 20: '#808000', 21: '#000080' };

        let initialValueInput, maxValueInput, rowsInput;
        let activeTargetId = null;
        let touchTimer;
        let touchStartX, touchStartY;

        function activateCapture(id) {
            document.querySelectorAll('.input-wrapper').forEach(w => w.classList.remove('active'));
            document.getElementById('wrap-' + id).classList.add('active');
            activeTargetId = id;
        }

        function openKeyboard(id) {
            activateCapture(id);
            let realInput = document.getElementById('real-' + id);
            realInput.value = document.querySelector(`#wrap-${id} .num-display`).innerText;
            realInput.focus();
        }

        function syncManual(id) {
            let val = document.getElementById('real-' + id).value;
            document.querySelector(`#wrap-${id} .num-display`).innerText = val;
            updateAll();
        }

        function setup() {
            pixelDensity(2);
            let ui = select('#ui-main');
            createSpan("Inicio:").parent(ui);
            initialValueInput = createInput('1').parent(ui);
            createSpan("Máx:").parent(ui);
            maxValueInput = createInput('21').parent(ui);
            createSpan("Filas:").parent(ui);
            rowsInput = createInput('40').parent(ui);

            initialValueInput.input(() => updateAll());
            maxValueInput.input(() => updateAll());
            rowsInput.input(() => updateAll());

            let canvas = createCanvas(windowWidth - 40, 1000);
            canvas.parent('canvas-container');

            // --- GESTIÓN DE EVENTOS NATIVOS ---
            let el = canvas.elt;
            
            // Mouse para PC
            el.addEventListener('mousedown', (e) => {
                if (activeTargetId && e.button === 0) executeSelection(e.offsetY);
            });

            // Touch para Móvil
            el.addEventListener('touchstart', (e) => {
                if (!activeTargetId || e.touches.length > 1) return;
                let t = e.touches[0];
                touchStartX = t.clientX;
                touchStartY = t.clientY;
                
                touchTimer = setTimeout(() => {
                    let rect = el.getBoundingClientRect();
                    let y = t.clientY - rect.top;
                    executeSelection(y);
                    if(navigator.vibrate) navigator.vibrate(60);
                }, 1000); // 1 segundo
            }, {passive: true});

            el.addEventListener('touchmove', (e) => {
                let t = e.touches[0];
                let d = dist(touchStartX, touchStartY, t.clientX, t.clientY);
                if (d > 10) clearTimeout(touchTimer); // Es scroll, cancelar
            }, {passive: true});

            el.addEventListener('touchend', () => clearTimeout(touchTimer));

            updateAll();
        }

        function executeSelection(y) {
            let h = hexSize * 1.5;
            let fila = Math.round((y - 100) / h) + 1;
            if (fila >= 1 && activeTargetId) {
                document.querySelector(`#wrap-${activeTargetId} .num-display`).innerText = fila;
                updateAll();
            }
        }

        function updateAll() {
            let rows = parseInt(rowsInput.value()) || 1;
            hexSize = rows > 60 ? (rows > 150 ? 5 : 8) : 15;
            let h = hexSize * 1.5;
            resizeCanvas(width, (rows * 2 * h) + 400);
            analizarProgresion();
            redraw();
        }

        function analizarProgresion() {
            let ids = ['v1','v2','v3','v4'];
            let v = ids.map(id => parseFloat(document.querySelector(`#wrap-${id} .num-display`).innerText)).filter(n => !isNaN(n));
            let res = document.getElementById('equation-text');
            if (v.length < 2) return;
            let d1 = v[1] - v[0];
            let d2 = v.length > 2 ? v[2] - v[1] : d1;
            let r = d1 !== 0 ? d2 / d1 : 0;
            if (r > 0 && r !== 1 && v.length >= 3) {
                let a = d1 / (r - 1); let c = v[0] - a;
                res.innerText = `Ecuación: aₙ = ${r.toFixed(0)}ⁿ + ${c.toFixed(0)}`;
            } else {
                let d = v[1] - v[0];
                res.innerText = `Ecuación Lineal: aₙ = ${d}n + ${v[0]-d}`;
            }
        }

        function draw() {
            background(10);
            let rows = parseInt(rowsInput.value()) || 40;
            let maxVal = parseInt(maxValueInput.value()) || 21;
            let h = hexSize * 1.5;
            let w = Math.sqrt(3) * hexSize;

            // Iluminar selección (Líneas amarillas)
            ['v1','v2','v3','v4'].forEach(id => {
                let f = parseInt(document.querySelector(`#wrap-${id} .num-display`).innerText);
                if(!isNaN(f)) {
                    stroke(255, 235, 59, 150); strokeWeight(4);
                    line(0, 100 + (f-1)*h, width, 100 + (f-1)*h);
                }
            });

            // Cristal
            let allRows = [];
            for (let r = 0; r < rows; r++) {
                let rowVals = [];
                for (let c = 0; c <= r; c++) {
                    let val = (r === 0 || c === 0 || c === r) ? 1 : wrappedSum(allRows[r-1][c-1] + allRows[r-1][c], maxVal);
                    rowVals.push(val);
                    drawHex(width/2 + (c - r/2) * w, 100 + r * h, val, hexSize);
                }
                allRows.push(rowVals);
            }
            let lastR = allRows[rows-1];
            for (let r = 1; r < rows; r++) {
                let nextR = [];
                for (let c = 0; c < lastR.length - 1; c++) {
                    let val = wrappedSum(lastR[c] + lastR[c+1], maxVal);
                    nextR.push(val);
                    drawHex(width/2 + (c - (lastR.length-2)/2) * w, 100 + (rows - 1 + r) * h, val, hexSize);
                }
                lastR = nextR;
            }

            // Guías rojas
            for (let i = 1; i <= rows * 2; i++) {
                if (i === 1 || i % 10 === 0) {
                    let ly = 100 + (i-1)*h;
                    stroke(255, 0, 0, 100); strokeWeight(1.5);
                    line(100, ly, width-100, ly);
                    noStroke(); fill(255, 100, 100); textSize(12); text("Fila "+i, 40, ly+4);
                }
            }
        }

        function drawHex(x, y, v, s) {
            let m = 1200;
            if (y < scrollY - m || y > scrollY + windowHeight + m) return;
            push(); translate(x, y); fill(colorMap[v] || '#444'); stroke(0, 30);
            beginShape();
            for (let i = 0; i < 6; i++) { let a = TWO_PI/6 * i - PI / 2; vertex(cos(a)*s, sin(a)*s); }
            endShape(CLOSE);
            if (s > 7) { fill(v > 15 || [2,3,21].includes(v) ? 255 : 0); textAlign(CENTER, CENTER); textSize(s*0.65); text(v, 0, 0); }
            pop();
        }

        function wrappedSum(n, m) { let r = n; while (r > m) r -= m; return r; }
    </script>
</body>
</html>
